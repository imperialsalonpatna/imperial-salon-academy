<style>

:root{
  --blush:#f3d8d8;
  --blush-light:#fbefef;
  --sage:#a9b9a3;
  --sage-dark:#536653;
  --gold:#b58a45;
  --gold-light:#d8b56d;
  --cream:#fffaf5;
  --dark:#28352c;
  --text:#4c504b;
  --white:#fff;
  --line:#eadfd3;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--cream);
  color:var(--text);
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font:inherit;
}

/* =====================================================
   TOP BAR
===================================================== */

.top-bar{
  background:var(--sage-dark);
  color:#fff;
  text-align:center;
  padding:7px 15px;
  font-size:12px;
  letter-spacing:.5px;
}

/* =====================================================
   HEADER
===================================================== */

header{
  background:rgba(255,250,245,.97);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:1000;
  backdrop-filter:blur(8px);
}

.navbar{
  width:min(1150px,92%);
  margin:auto;
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
  position:relative;
}

.brand{
  display:flex;
  align-items:center;
  flex-shrink:0;
}

/*
  IMPORTANT:
  Keep your logo file at:
  images/imperial-logo.png
*/

.brand-logo{
  width:205px;
  height:64px;
  object-fit:contain;
  object-position:left center;
  display:block;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:23px;
  font-size:14px;
  font-weight:600;
  color:var(--dark);
}

.nav-links a{
  transition:.2s ease;
}

.nav-links a:hover{
  color:var(--gold);
}

.mobile-menu{
  display:none;
  border:0;
  background:none;
  font-size:27px;
  color:var(--sage-dark);
  cursor:pointer;
}

/* =====================================================
   COMMON
===================================================== */

.container{
  width:min(1150px,92%);
  margin:auto;
}

.section{
  padding:72px 0;
}

.eyebrow{
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:12px;
  font-weight:bold;
}

.btn{
  display:inline-block;
  padding:12px 22px;
  border-radius:30px;
  font-weight:bold;
  transition:.2s ease;
}

.btn-gold{
  background:var(--gold-light);
  color:var(--dark);
}

.btn-gold:hover{
  transform:translateY(-2px);
  background:var(--gold);
  color:#fff;
}

/* =====================================================
   HERO SLIDER
===================================================== */

.hero{
  position:relative;
  height:min(700px,78vh);
  min-height:570px;
  overflow:hidden;
  background:var(--sage-dark);
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition:opacity .8s ease;
}

.slide.active{
  opacity:1;
  pointer-events:auto;
}

.slide-video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.slide-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(31,48,38,.78),
      rgba(31,48,38,.32),
      rgba(31,48,38,.15)
    );
}

.slide-content{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  width:min(1150px,92%);
  margin:auto;
  color:#fff;
}

.slide-content-inner{
  max-width:670px;
}

.slide .eyebrow{
  color:var(--gold-light);
}

.slide h1{
  font-family:Georgia,serif;
  font-size:clamp(42px,6vw,72px);
  line-height:1.08;
  margin:15px 0;
  color:#fff;
}

.slide p{
  font-size:18px;
  max-width:580px;
  margin-bottom:23px;
}

.slider-controls{
  position:absolute;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  z-index:5;
}

.slider-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  border:1px solid #fff;
  background:transparent;
  cursor:pointer;
  padding:0;
}

.slider-dot.active{
  background:#fff;
}

/* =====================================================
   OUR AREAS OF EXPERTISE
===================================================== */

.specialisation{
  background:linear-gradient(
    135deg,
    var(--blush-light),
    var(--cream)
  );
  padding:72px 0 68px;
}

.specialisation-heading{
  max-width:850px;
  text-align:center;
  margin:0 auto 38px;
}

.specialisation-heading h2{
  font-family:Georgia,serif;
  color:var(--sage-dark);
  font-size:clamp(34px,5vw,50px);
  margin-top:8px;
  line-height:1.15;
}

.specialisation-heading p{
  max-width:800px;
  margin:18px auto 0;
  color:#62645f;
  font-size:16px;
  line-height:1.75;
}

/* Four expertise items */

.specialisation-list{
  max-width:900px;
  margin:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.specialisation-item{
  position:relative;
  width:100%;
  text-align:center;
  padding:19px 15px;
  font-family:Georgia,serif;
  font-size:clamp(23px,3.1vw,37px);
  font-weight:700;
  letter-spacing:.2px;
  color:var(--sage-dark);
}

.specialisation-item:nth-child(2){
  color:#5f6f5d;
}

.specialisation-item:nth-child(3){
  color:#9a7139;
}

.specialisation-item:nth-child(4){
  color:#6b6170;
}

.specialisation-item:before{
  content:"";
  display:inline-block;
  width:9px;
  height:9px;
  border:1.5px solid var(--gold);
  border-radius:50%;
  margin:0 14px 5px 0;
}

.specialisation-item + .specialisation-item{
  border-top:1px solid rgba(181,138,69,.25);
}

/* =====================================================
   ABOUT IMPERIAL
   Ambience video is part of this section
===================================================== */

.about-section{
  background:var(--cream);
  padding:72px 0 78px;
}

.about-heading{
  text-align:center;
  margin-bottom:28px;
}

.about-heading h2{
  font-family:Georgia,serif;
  color:var(--sage-dark);
  font-size:clamp(34px,4.5vw,48px);
  line-height:1.15;
  margin-top:8px;
}

.about-video{
  width:100%;
  max-width:900px;
  margin:0 auto 38px;
  border-radius:16px;
  overflow:hidden;
  background:#d9d0c8;
  box-shadow:0 16px 38px rgba(80,90,75,.12);
}

.about-video video{
  width:100%;
  aspect-ratio:16/9;
  height:auto;
  object-fit:cover;
  display:block;
}

.about-content{
  max-width:900px;
  margin:auto;
  text-align:center;
}

.about-content .established{
  font-size:18px;
  color:var(--sage-dark);
  margin-bottom:20px;
}

.about-content p{
  max-width:820px;
  margin:0 auto 16px;
  font-size:16px;
  color:#555852;
}

/* =====================================================
   HIGHLIGHTS
===================================================== */

.highlights-section{
  background:#fff;
  padding:65px 0 72px;
}

.highlights-heading{
  text-align:center;
  margin-bottom:34px;
}

.highlights-heading h2{
  font-family:Georgia,serif;
  color:var(--sage-dark);
  font-size:clamp(30px,4vw,42px);
}

/*
  Cards intentionally have a different visual language
  from the heading.
*/

.highlights-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
  max-width:1050px;
  margin:auto;
}

.highlight-card{
  position:relative;
  min-height:190px;
  padding:30px 24px;
  border-radius:20px;
  background:
    linear-gradient(
      145deg,
      #fdf8f2,
      #f7eeee
    );
  border:1px solid #eadfd3;
  box-shadow:0 10px 28px rgba(80,90,75,.08);
  text-align:center;
  overflow:hidden;
  transition:.25s ease;
}

.highlight-card:nth-child(2){
  background:
    linear-gradient(
      145deg,
      #f4f8f1,
      #edf3eb
    );
}

.highlight-card:nth-child(3){
  background:
    linear-gradient(
      145deg,
      #fffaf0,
      #f7f0df
    );
}

.highlight-card:hover{
  transform:translateY(-6px);
  box-shadow:0 17px 35px rgba(80,90,75,.13);
}

.highlight-card:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:4px;
  background:linear-gradient(
    90deg,
    var(--gold),
    var(--gold-light)
  );
}

.highlight-number{
  font-family:Georgia,serif;
  font-size:13px;
  letter-spacing:3px;
  color:var(--gold);
  margin-bottom:12px;
}

.highlight-card h3{
  font-family:Georgia,serif;
  color:var(--sage-dark);
  font-size:20px;
  margin-bottom:10px;
}

.highlight-card p{
  font-size:14px;
  line-height:1.6;
  color:#666961;
}

/* =====================================================
   SERVICES
===================================================== */

.services-preview{
  background:var(--cream);
  padding:72px 0;
}

.section-heading{
  text-align:center;
  max-width:720px;
  margin:0 auto 42px;
