<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imperial Beauty Salon & Academy | Patna</title>

<meta
  name="description"
  content="Imperial Beauty Salon & Academy, Patna — professional makeup, hair, skin and beauty services with practical beauty education."
>

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --blush:#f3d8d8;
  --blush-light:#fbefef;

  --sage:#a9b9a3;
  --sage-dark:#536653;
  --sage-deep:#35483a;

  --gold:#b58a45;
  --gold-light:#d8b56d;

  --cream:#fffaf5;
  --white:#ffffff;

  --dark:#28352c;
  --text:#4c504b;
  --muted:#6a6a64;

  --line:#eadfd3;
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--cream);
  color:var(--text);
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font:inherit;
}


/* =========================================================
   TOP BAR
========================================================= */

.top-bar{
  background:var(--sage-dark);
  color:#fff;
  text-align:center;
  padding:7px 15px;
  font-size:12px;
  letter-spacing:.5px;
}


/* =========================================================
   HEADER
========================================================= */

header{
  background:rgba(255,250,245,.97);
  border-bottom:1px solid var(--line);

  position:sticky;
  top:0;
  z-index:1000;

  backdrop-filter:blur(8px);
}

.navbar{
  width:min(1150px,92%);
  margin:auto;

  min-height:78px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:25px;
  position:relative;
}

.brand{
  display:flex;
  align-items:center;
  flex-shrink:0;
}

.brand-logo{
  width:205px;
  height:64px;

  object-fit:contain;
  object-position:left center;

  display:block;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:23px;

  font-size:14px;
  font-weight:600;

  color:var(--dark);
}

.nav-links a{
  transition:.2s ease;
}

.nav-links a:hover{
  color:var(--gold);
}

.mobile-menu{
  display:none;

  border:0;
  background:none;

  font-size:27px;

  color:var(--sage-dark);

  cursor:pointer;
}


/* =========================================================
   COMMON
========================================================= */

.container{
  width:min(1150px,92%);
  margin:auto;
}

.section{
  padding:72px 0;
}

.btn{
  display:inline-block;

  padding:12px 22px;

  border-radius:30px;

  font-weight:bold;

  transition:.2s ease;
}

.btn-gold{
  background:var(--gold-light);
  color:var(--dark);
}

.btn-gold:hover{
  transform:translateY(-2px);

  background:var(--gold);
  color:#fff;
}


/* =========================================================
   HERO SLIDER
========================================================= */

.hero{
  position:relative;

  height:min(700px,78vh);
  min-height:570px;

  overflow:hidden;

  background:var(--sage-dark);
}

.slide{
  position:absolute;
  inset:0;

  opacity:0;
  pointer-events:none;

  transition:opacity .8s ease;
}

.slide.active{
  opacity:1;
  pointer-events:auto;
}

.slide-video{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.slide-overlay{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(31,48,38,.78),
      rgba(31,48,38,.32),
      rgba(31,48,38,.15)
    );
}

.slide-content{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;

  width:min(1150px,92%);
  margin:auto;

  color:#fff;
}

.slide-content-inner{
  max-width:670px;
}

.slide h1{
  font-family:Georgia,serif;

  font-size:clamp(42px,6vw,72px);

  line-height:1.08;

  margin:15px 0;

  color:#fff;
}

.slide p{
  font-size:18px;

  max-width:580px;

  margin-bottom:23px;
}

.slider-controls{
  position:absolute;

  bottom:28px;
  left:50%;

  transform:translateX(-50%);

  display:flex;
  gap:8px;

  z-index:5;
}

.slider-dot{
  width:9px;
  height:9px;

  border-radius:50%;

  border:1px solid #fff;

  background:transparent;

  cursor:pointer;

  padding:0;
}

.slider-dot.active{
  background:#fff;
}


/* =========================================================
   OUR AREAS OF EXPERTISE
========================================================= */

.specialisation{
  background:
    linear-gradient(
      135deg,
      var(--blush-light),
      var(--cream)
    );

  padding:72px 0 70px;
}

.specialisation-heading{
  max-width:850px;

  text-align:center;

  margin:0 auto 38px;
}

.specialisation-heading h2{
  font-family:Georgia,serif;

  color:var(--sage-dark);

  font-size:clamp(34px,5vw,50px);

  line-height:1.15;

  margin-bottom:14px;
}

.specialisation-heading p{
  max-width:780px;

  margin:auto;

  color:#62645f;

  font-size:16px;

  line-height:1.7;
}

.specialisation-list{
  max-width:1050px;

  margin:auto;

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:20px;
}

.specialisation-item{
  position:relative;

  min-height:105px;

  padding:25px 28px;

  border-radius:16px;

  display:flex;
  align-items:center;

  font-family:Georgia,serif;

  font-size:clamp(21px,2.5vw,29px);

  font-weight:700;

  background:#fff;

  box-shadow:
    0 8px 24px rgba(80,90,75,.08);

  border:1px solid rgba(181,138,69,.18);

  transition:.25s ease;
}

.specialisation-item:hover{
  transform:translateY(-4px);

  box-shadow:
    0 15px 32px rgba(80,90,75,.13);
}

.specialisation-item:nth-child(1){
  color:#536653;
  border-left:5px solid #536653;
  background:linear-gradient(135deg,#ffffff,#f2f7f0);
}

.specialisation-item:nth-child(2){
  color:#8d6740;
  border-left:5px solid #b58a45;
  background:linear-gradient(135deg,#ffffff,#fbf5e9);
}

.specialisation-item:nth-child(3){
  color:#725f72;
  border-left:5px solid #8e7890;
  background:linear-gradient(135deg,#ffffff,#f8f2f8);
}

.specialisation-item:nth-child(4){
  color:#53747b;
  border-left:5px solid #6c9399;
  background:linear-gradient(135deg,#ffffff,#eef7f8);
}

.specialisation-item:before{
  content:"";

  width:11px;
  height:11px;

  border-radius:50%;

  margin-right:17px;

  flex-shrink:0;

  border:2px solid currentColor;
}


/* =========================================================
   ABOUT IMPERIAL
========================================================= */

.about-section{
  background:var(--cream);

  padding:72px 0 76px;
}

.about-heading{
  text-align:center;

  margin-bottom:32px;
}

.about-heading h2{
  font-family:Georgia,serif;

  color:var(--sage-dark);

  font-size:clamp(34px,5vw,50px);

  line-height:1.15;
}

.about-layout{
  max-width:1050px;

  margin:auto;

  display:grid;

  grid-template-columns:.9fr 1.1fr;

  gap:48px;

  align-items:center;
}

.about-video-frame{
  width:100%;

  max-width:430px;

  margin:auto;

  border-radius:18px;

  overflow:hidden;

  background:#ddd;

  box-shadow:
    0 18px 45px rgba(80,90,75,.14);
}

.about-video-frame video{
  width:100%;

  aspect-ratio:4/5;

  object-fit:cover;

  display:block;
}

.about-article{
  font-size:16px;

  line-height:1.75;

  color:#555952;
}

.about-article p{
  margin-bottom:16px;
}

.about-article p:last-child{
  margin-bottom:0;
}

.about-article strong{
  color:var(--sage-dark);
}


/* =========================================================
   HIGHLIGHTS
========================================================= */

.highlights-section{
  background:#fff;

  padding:12px 0 60px;
}

.highlights-heading{
  text-align:center;

  margin-bottom:28px;
}

.highlights-heading h2{
  font-family:Georgia,serif;

  color:var(--sage-dark);

  font-size:clamp(30px,4.5vw,42px);
}

.highlights-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:20px;

  max-width:1050px;

  margin:auto;
}

.highlight-card{
  min-height:205px;

  padding:28px 24px;

  border-radius:18px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      #fffdf9,
      #f6f0e8
    );

  border:1px solid #e5d9cc;

  box-shadow:
    0 8px 24px rgba(80,90,75,.07);

  transition:.25s ease;
}

.highlight-card:hover{
  transform:translateY(-5px);

  box-shadow:
    0 16px 34px rgba(80,90,75,.12);
}

.highlight-icon{
  width:54px;
  height:54px;

  margin:0 auto 14px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--blush-light);

  border:1px solid rgba(181,138,69,.35);

  color:var(--gold);

  font-family:Georgia,serif;

  font-size:24px;
}

.highlight-card strong{
  display:block;

  color:var(--sage-dark);

  font-family:Georgia,serif;

  font-size:19px;

  margin-bottom:9px;
}

.highlight-card p{
  max-width:285px;

  margin:auto;

  font-size:14px;

  color:#686862;

  line-height:1.55;
}


/* =========================================================
   OUR SERVICES — NEW REFERENCE STYLE
========================================================= */

.services-preview{
  background:
    linear-gradient(
      180deg,
      #fffaf5 0%,
      #f8f2eb 100%
    );

  padding:78px 0 84px;
}

.services-heading{
  max-width:760px;

  margin:0 auto 42px;

  text-align:center;
}

.services-heading h2{
  font-family:Georgia,serif;

  color:var(--sage-dark);

  font-size:clamp(35px,5vw,50px);

  line-height:1.15;

  margin-bottom:14px;
}

.services-heading p{
  color:#686862;

  font-size:16px;

  line-height:1.7;

  max-width:650px;

  margin:auto;
}


/*
   Horizontal service list
*/

.services-list{
  width:min(1000px,100%);

  margin:auto;

  display:flex;

  flex-direction:column;

  gap:16px;
}


/*
   Individual horizontal service card
*/

.service-row{
  display:grid;

  grid-template-columns:86px 1fr auto;

  align-items:center;

  gap:24px;

  min-height:125px;

  padding:22px 27px;

  background:rgba(255,255,255,.82);

  border:1px solid #e6dcd1;

  border-radius:18px;

  box-shadow:
    0 6px 20px rgba(80,90,75,.055);

  position:relative;

  overflow:hidden;

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}


/*
   Soft accent line
*/

.service-row::before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:4px;

  background:var(--gold);

  opacity:.75;
}


/*
   Hover
*/

.service-row:hover{
  transform:translateY(-3px);

  border-color:#d9c9b6;

  box-shadow:
    0 14px 30px rgba(80,90,75,.10);
}


/*
   Service icon area
*/

.service-icon{
  width:72px;
  height:72px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      145deg,
      #f7e2e1,
      #f2d1cf
    );

  border:1px solid rgba(181,138,69,.28);

  color:var(--sage-dark);

  font-size:29px;

  flex-shrink:0;

  transition:.25s ease;
}

.service-row:hover .service-icon{
  transform:scale(1.05);

  background:
    linear-gradient(
      145deg,
      #ead0cf,
      #f5e0de
    );
}


/*
   Text area
*/

.service-info{
  min-width:0;
}

.service-info h3{
  font-family:Georgia,serif;

  color:var(--sage-dark);

  font-size:23px;

  line-height:1.25;

  margin-bottom:7px;
}

.service-info p{
  color:#686862;

  font-size:14px;

  line-height:1.6;

  max-width:620px;
}


/*
   Arrow / action indicator
*/

.service-arrow{
  width:40px;
  height:40px;

  border-radius:50%;

  border:1px solid #d9c9b6;

  display:flex;

  align-items:center;
  justify-content:center;

  color:var(--gold);

  font-size:19px;

  flex-shrink:0;

  transition:.25s ease;
}

.service-row:hover .service-arrow{
  background:var(--gold);

  color:#fff;

  border-color:var(--gold);

  transform:translateX(3px);
}


/*
   Four service icon variations
*/

.service-row:nth-child(1) .service-icon{
  background:#f5dddd;
  color:#7b5b5b;
}

.service-row:nth-child(2) .service-icon{
  background:#edf2e9;
  color:#536653;
}

.service-row:nth-child(3) .service-icon{
  background:#f5eddf;
  color:#8d6740;
}

.service-row:nth-child(4) .service-icon{
  background:#eee7f1;
  color:#725f72;
}


/* =========================================================
   ACADEMY
========================================================= */

.academy-banner{
  position:relative;

  overflow:hidden;

  background:var(--sage-dark);

  color:#fff;

  padding:70px 0;
}

.academy-grid{
  display:grid;

  grid-template-columns:1.05fr .95fr;

  gap:50px;

  align-items:center;

  max-width:1050px;

  margin:auto;
}

.academy-content{
  max-width:650px;
}

.academy-content h2{
  font-family:Georgia,serif;

  color:#fff;

  font-size:clamp(36px,5vw,52px);

  margin:0 0 17px;

  line-height:1.12;
}

.academy-content p{
  color:#f3f3f0;

  font-size:16px;

  line-height:1.7;

  margin-bottom:25px;
}

.academy-video{
  width:100%;

  max-width:430px;

  margin:auto;

  border-radius:18px;

  overflow:hidden;

  box-shadow:
    0 18px 40px rgba(0,0,0,.18);

  background:#304238;
}

.academy-video video{
  width:100%;

  aspect-ratio:4/5;

  object-fit:cover;

  display:block;
}


/* =========================================================
   TESTIMONIALS
========================================================= */

.testimonials-section{
  background:
    linear-gradient(
      135deg,
      #fbefef,
      #f8f4ec
    );

  padding:70px 0 72px;

  overflow:hidden;
}

.testimonials-heading{
  text-align:center;

  max-width:760px;

  margin:0 auto 36px;
}

.testimonials-heading h2{
  font-family:Georgia,serif;

  color:var(--sage-dark);

  font-size:clamp(30px,4.5vw,44px);

  line-height:1.15;
}

.testimonial-viewport{
  width:100%;

  overflow:hidden;

  position:relative;

  mask-image:
    linear-gradient(
      to right,
      transparent,
      black 6%,
      black 94%,
      transparent
    );

  -webkit-mask-image:
    linear-gradient(
      to right,
      transparent,
      black 6%,
      black 94%,
      transparent
    );
}

.testimonial-track{
  display:flex;

  width:max-content;

  animation:
    testimonialMove 75s linear infinite;
}

.testimonial-track:hover{
  animation-play-state:paused;
}

.testimonial-slide{
  width:min(650px,82vw);

  min-height:190px;

  margin:0 12px;

  padding:25px 30px;

  border:1px solid #e3d7ca;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.95),
      rgba(255,250,245,.95)
    );

  box-shadow:
    0 8px 25px rgba(80,90,75,.08);

  flex-shrink:0;

  display:flex;

  flex-direction:column;

  justify-content:center;
}

.quote-mark{
  font-family:Georgia,serif;

  font-size:38px;

  line-height:.6;

  color:var(--gold);

  margin-bottom:10px;
}

.testimonial-stars{
  color:#d49b2e;

  letter-spacing:2px;

  font-size:13px;

  margin-bottom:9px;
}

.testimonial-text{
  font-size:14px;

  line-height:1.55;

  color:#50534f;

  margin-bottom:12px;
}

.testimonial-author{
  color:var(--sage-dark);

  font-weight:bold;

  font-size:13px;
}

@keyframes testimonialMove{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }

}

.google-cta{
  text-align:center;

  margin-top:34px;
}

.google-cta .btn{
  border:1px solid var(--gold);
}


/* =========================================================
   CONTACT
========================================================= */

.contact-footer{
  background:var(--sage-dark);

  color:#fff;

  padding:48px 0 28px;

  position:relative;

  overflow:hidden;
}

.contact-heading{
  text-align:center;

  color:var(--gold-light);

  font-family:Georgia,serif;

  font-size:30px;

  letter-spacing:2px;

  margin-bottom:35px;
}

.contact-grid{
  display:grid;

  grid-template-columns:1fr 1fr 1fr;

  gap:30px;

  align-items:center;
}

.contact-item{
  text-align:center;

  padding:10px 25px;

  min-height:130px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;
}

.contact-item + .contact-item{
  border-left:1px solid rgba(255,255,255,.18);
}

.contact-icon{
  width:58px;
  height:58px;

  border-radius:50%;

  background:#fff;

  color:var(--gold);

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  margin-bottom:10px;
}

.contact-label{
  color:var(--gold-light);

  font-size:13px;

  letter-spacing:2px;

  font-weight:700;

  margin-bottom:6px;
}

.contact-value{
  font-family:Georgia,serif;

  font-size:18px;
}

.social-title{
  font-family:cursive;

  color:var(--gold-light);

  font-size:31px;

  margin-bottom:12px;
}

.social-links{
  display:flex;

  gap:13px;

  justify-content:center;
}

.social-link{
  width:48px;
  height:48px;

  border:1px solid var(--gold-light);

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:rgba(255,255,255,.08);

  font-weight:bold;
}

.social-link:hover{
  background:#fff;

  color:var(--sage-dark);
}

.footer-bottom{
  width:min(1150px,92%);

  margin:35px auto 0;

  padding-top:18px;

  border-top:1px solid rgba(255,255,255,.15);

  font-size:12px;

  color:#c7c7c7;

  text-align:center;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

  .brand-logo{
    width:175px;
    height:60px;
  }

  .nav-links{
    display:none;

    position:absolute;

    top:78px;

    left:0;
    right:0;

    background:var(--cream);

    padding:22px;

    flex-direction:column;

    align-items:stretch;

    border-bottom:1px solid var(--line);

    box-shadow:
      0 12px 25px rgba(0,0,0,.07);
  }

  .nav-links.open{
    display:flex;
  }

  .mobile-menu{
    display:block;
  }


  /* HERO */

  .hero{
    min-height:620px;

    height:75vh;
  }

  .slide-content{
    align-items:flex-end;

    padding-bottom:85px;
  }

  .slide h1{
    font-size:43px;
  }

  .slide p{
    font-size:16px;
  }


  /* EXPERTISE */

  .specialisation-list{
    grid-template-columns:1fr;
  }


  /* ABOUT */

  .about-layout{
    grid-template-columns:1fr;

    gap:35px;
  }

  .about-video-frame{
    max-width:390px;
  }


  /* HIGHLIGHTS */

  .highlights-grid{
    grid-template-columns:1fr;
  }


  /* SERVICES */

  .services-preview{
    padding:65px 0 70px;
  }

  .services-list{
    gap:14px;
  }

  .service-row{
    grid-template-columns:72px 1fr auto;

    gap:18px;

    min-height:115px;

    padding:20px 21px;
  }

  .service-icon{
    width:62px;
    height:62px;

    font-size:25px;
  }

  .service-info h3{
    font-size:20px;
  }

  .service-info p{
    font-size:13.5px;
  }


  /* ACADEMY */

  .academy-grid{
    grid-template-columns:1fr;

    gap:35px;
  }

  .academy-video{
    max-width:390px;
  }


  /* CONTACT */

  .contact-grid{
    grid-template-columns:1fr;
  }

  .contact-item + .contact-item{
    border-left:0;

    border-top:1px solid rgba(255,255,255,.18);
  }


  /* TESTIMONIALS */

  .testimonial-slide{
    width:82vw;

    min-height:190px;
  }

}
