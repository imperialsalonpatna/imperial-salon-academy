<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperial Beauty Salon & Academy — Instagram & Gallery</title>
  <style>
    :root{
      --blush:#f5dfe3;
      --sage:#a8b9a1;
      --gold:#b8954d;
      --cream:#fffaf5;
      --ink:#2f2927;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      color:var(--ink);
      background:var(--cream);
    }

    .section{
      padding:72px 20px;
      max-width:1180px;
      margin:auto;
    }

    .section-heading{
      text-align:center;
      margin-bottom:34px;
    }

    .section-heading h2{
      margin:0 0 10px;
      font-size:clamp(30px,5vw,46px);
      font-weight:500;
      letter-spacing:.02em;
    }

    .section-heading p{
      margin:0 auto;
      font-family:Arial, sans-serif;
      font-size:15px;
      letter-spacing:.04em;
      color:#6d625e;
    }

    /* A Glimpse of Our Work */
    .work-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      max-width:900px;
      margin:0 auto;
    }

    .work-card{
      position:relative;
      display:block;
      aspect-ratio:1/1;
      overflow:hidden;
      border-radius:10px;
      background:linear-gradient(135deg,var(--blush),var(--sage));
      text-decoration:none;
      box-shadow:0 5px 18px rgba(47,41,39,.10);
    }

    .work-card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:transform .45s ease, filter .45s ease;
    }

    .work-card:hover img{
      transform:scale(1.05);
      filter:brightness(.86);
    }

    .reel-badge{
      position:absolute;
      top:12px;
      right:12px;
      padding:7px 10px;
      border-radius:999px;
      background:rgba(255,250,245,.92);
      color:var(--ink);
      font:600 11px Arial,sans-serif;
      letter-spacing:.08em;
    }

    .play{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:52px;
      height:52px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(255,250,245,.90);
      color:var(--gold);
      font:700 20px Arial,sans-serif;
      padding-left:3px;
      opacity:.95;
    }

    .instagram-cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin:32px auto 0;
      padding:13px 25px;
      border:1px solid var(--gold);
      border-radius:999px;
      color:var(--ink);
      background:transparent;
      text-decoration:none;
      font:600 13px Arial,sans-serif;
      letter-spacing:.06em;
      transition:.25s ease;
    }

    .instagram-cta:hover{
      background:var(--gold);
      color:white;
    }

    .cta-wrap{text-align:center}

    /* Gallery */
    .gallery-intro{
      text-align:center;
      max-width:650px;
      margin:0 auto 35px;
      color:#6d625e;
      font:15px/1.7 Arial,sans-serif;
    }

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }

    .gallery-item{
      overflow:hidden;
      border-radius:10px;
      aspect-ratio:4/5;
      background:#eee;
    }

    .gallery-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:transform .4s ease;
    }

    .gallery-item:hover img{transform:scale(1.04)}

    @media (max-width:760px){
      .section{padding:54px 16px}
      .work-grid{grid-template-columns:repeat(2,1fr);gap:10px}
      .gallery-grid{grid-template-columns:repeat(2,1fr);gap:10px}
      .play{width:44px;height:44px;font-size:17px}
    }

    @media (max-width:430px){
      .section-heading h2{font-size:31px}
      .section-heading p{font-size:13px}
    }
  </style>
</head>
